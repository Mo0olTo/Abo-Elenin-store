<section class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-10">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-sm">
    <h1 class="text-2xl font-semibold text-slate-900">Admin login</h1>
    <p class="mt-2 text-sm text-slate-500">Sign in to manage products and categories.</p>

    <form class="mt-8 space-y-4" (submit)="onSubmit($event)">
      <app-text-field
        label="Email"
        type="email"
        autocomplete="email"
        [value]="facade.email()"
        [disabled]="facade.loading()"
        (valueChange)="facade.setEmail($event)"
      />

      <app-text-field
        label="Password"
        type="password"
        autocomplete="current-password"
        [value]="facade.password()"
        [disabled]="facade.loading()"
        (valueChange)="facade.setPassword($event)"
      />

      @if (facade.hasError()) {
        <p class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{{ facade.error() }}</p>
      }

      <app-button
        type="submit"
        label="Sign in"
        loadingLabel="Signing in..."
        [loading]="facade.loading()"
        [disabled]="!facade.canSubmit()"
      />
    </form>
  </div>
</section>

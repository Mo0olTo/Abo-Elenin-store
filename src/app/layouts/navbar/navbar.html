<header class="navbar">
  <nav class="navbar__bar">
    <a
      routerLink="/store/home"
      class="navbar__brand"
      aria-label="Abo El Enin Optics"
      (click)="closeMenu()"
    >
      <img src="/images/icon.png" alt="" class="navbar__logo" />
      <img src="/images/logo.webp" alt="" class="navbar__wordmark invert" />
    </a>

    <button
      class="navbar__toggle"
      type="button"
      [class.navbar__toggle--open]="menuOpen()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="store-nav-menu"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()"
    >
      <span class="navbar__toggle-line"></span>
      <span class="navbar__toggle-line"></span>
      <span class="navbar__toggle-line"></span>
    </button>

    <div class="navbar__dropdown" [class.navbar__dropdown--open]="menuOpen()" id="store-nav-menu">
      <div class="navbar__dropdown-inner">
        <div class="navbar__links">
          <a
            routerLink="/store/home"
            routerLinkActive="navbar__link--active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="navbar__link"
            data-label="Home"
            (click)="closeMenu()"
          >
            Home
          </a>
          <a
            routerLink="/store/categories"
            routerLinkActive="navbar__link--active"
            class="navbar__link"
            data-label="Categories"
            (click)="closeMenu()"
          >
            Categories
          </a>
          <a
            routerLink="/store/new-arrivals"
            routerLinkActive="navbar__link--active"
            class="navbar__link"
            data-label="New arrivals"
            (click)="closeMenu()"
          >
            New arrivals
          </a>
          <a
            routerLink="/store/products"
            routerLinkActive="navbar__link--active"
            class="navbar__link"
            data-label="Products"
            (click)="closeMenu()"
          >
            Products
          </a>
          <a
            routerLink="/store/cart"
            routerLinkActive="navbar__link--active"
            class="navbar__link"
            data-label="Cart"
            (click)="closeMenu()"
          >
            Cart
          </a>
        </div>
      </div>
    </div>
  </nav>
</header>

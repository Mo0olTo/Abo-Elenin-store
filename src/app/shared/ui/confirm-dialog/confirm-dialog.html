@if (open()) {
  <div
    class="fixed inset-0 z-[80] grid place-items-center bg-slate-900/40 p-4"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'confirm-dialog-title'"
    (click)="cancelled.emit()"
  >
    <div
      class="w-full max-w-md rounded-2xl bg-brand-white p-6 shadow-lg"
      (click)="$event.stopPropagation()"
    >
      <h2 id="confirm-dialog-title" class="m-0 text-lg font-semibold text-brand-charcoal">
        {{ title() }}
      </h2>
      <p class="mt-2 text-sm text-slate-600">{{ message() }}</p>
      <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:justify-end">
        <button
          class="rounded-lg border border-black/15 px-4 py-2.5 text-sm font-medium text-brand-charcoal hover:bg-slate-50"
          type="button"
          (click)="cancelled.emit()"
        >
          {{ cancelLabel() }}
        </button>
        <app-button
          [variant]="confirmVariant()"
          [label]="confirmLabel()"
          (clicked)="confirmed.emit()"
        />
      </div>
    </div>
  </div>
}

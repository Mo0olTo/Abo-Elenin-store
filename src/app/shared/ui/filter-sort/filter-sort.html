@if (layout() === 'menu') {
  <button
    class="inline-flex items-center gap-2 rounded-lg border border-black/15 px-4 py-2 text-sm font-medium text-brand-charcoal"
    type="button"
    [attr.aria-expanded]="menuOpen()"
    aria-haspopup="listbox"
    aria-controls="product-sort-menu"
    (click)="toggleMenu()"
  >
    {{ selectedLabel() }}
    <svg class="size-4" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <path d="M5 7.5 10 12.5 15 7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    </svg>
  </button>

  @if (menuOpen()) {
    <ul
      id="product-sort-menu"
      class="absolute inset-e-0 z-80 mt-2 min-w-44 list-none rounded-xl border border-black/10 bg-brand-white p-1 shadow-lg"
      role="listbox"
    >
      @for (option of options; track option.value) {
        <li>
          <button
            class="flex w-full rounded-lg px-3 py-2 text-left text-sm text-brand-charcoal hover:bg-black/5"
            [class.font-semibold]="selected() === option.value"
            type="button"
            role="option"
            [attr.aria-selected]="selected() === option.value"
            (click)="select(option.value)"
          >
            {{ option.label }}
          </button>
        </li>
      }
    </ul>
  }
} @else {
  <section>
    <h2 class="m-0 text-sm font-semibold tracking-wide text-brand-gray uppercase">{{ title() }}</h2>

    <ul class="mt-3 m-0 grid list-none gap-2 p-0">
      @for (option of options; track option.value) {
        <li>
          <label class="flex cursor-pointer items-center gap-2 text-sm text-brand-charcoal">
            <input
              class="size-4 accent-brand-charcoal"
              type="radio"
              name="product-sort-list"
              [checked]="selected() === option.value"
              (change)="select(option.value)"
            />
            {{ option.label }}
          </label>
        </li>
      }
    </ul>
  </section>
}

<section class="relative md:px-12">
  <div
    class="overflow-hidden"
    emblaCarousel
    [options]="options"
    [subscribeToEvents]="emblaEvents"
    (emblaChange)="onEmblaChange()"
  >
    <div class="-ml-4 flex touch-pan-y">
      @for (product of products(); track product.id) {
        <div class="h-full min-w-0 shrink-0 grow-0 basis-1/2 pl-4 sm:basis-1/3">
          <app-product-card [product]="product" (addToCart)="addToCart.emit($event)" />
        </div>
      }
    </div>
  </div>

  <button
    type="button"
    class="absolute cursor-pointer top-1/2 left-0 z-10 hidden size-10 -translate-y-1/2 place-items-center rounded-full bg-brand-white text-brand-charcoal shadow md:grid disabled:cursor-not-allowed disabled:opacity-30"
    [disabled]="!canScrollPrev()"
    (click)="scrollPrev()"
    aria-label="Previous products"
  >
    <svg class="size-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M15 6 9 12l6 6"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <button
    type="button"
    class="absolute cursor-pointer top-1/2 right-0 z-10 hidden size-10 -translate-y-1/2 place-items-center rounded-full bg-brand-white text-brand-charcoal shadow md:grid disabled:cursor-not-allowed disabled:opacity-30"
    [disabled]="!canScrollNext()"
    (click)="scrollNext()"
    aria-label="Next products"
  >
    <svg class="size-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="m9 6 6 6-6 6"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</section>

<label class="block">
  <span class="mb-1.5 block text-sm font-medium text-slate-700">{{ label() }}</span>
  <input
    class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 outline-none transition focus:border-slate-900 focus:ring-2 focus:ring-slate-900/10 disabled:bg-slate-100"
    [attr.type]="type()"
    [value]="value()"
    [attr.autocomplete]="autocomplete() || null"
    [disabled]="disabled()"
    (input)="onInput($event)"
  />
</label>

<section class="mx-auto max-w-6xl px-4 py-12 md:py-16">
  <!-- Title -->
  <h1 class="mb-8 font-serif text-4xl font-semibold tracking-tight text-brand-charcoal md:mb-10 md:text-5xl">
    Collections
  </h1>

  <!-- Bento: 2 squares + 1 wide, repeated -->
  <div class="grid grid-cols-1 gap-4 md:grid-cols-2 md:gap-5">
    @for (collection of collections; track collection.slug; let i = $index) {
      <article
        class="relative min-h-72 overflow-hidden rounded-3xl md:min-h-96"
        [class.md:col-span-2]="isWide(i)"
      >
        <!-- Photo -->
        <img
          class="absolute inset-0 h-full w-full object-cover"
          [src]="collection.image"
          [alt]="collection.imageAlt"
        />

        <!-- Overlay -->
        <div class="absolute inset-0 bg-linear-to-t from-black/75 via-black/25 to-black/10"></div>

        <!-- Copy + Explore -->
        <div
          class="relative flex h-full min-h-72 flex-col justify-end gap-3 p-6 text-brand-white md:min-h-96 md:p-8"
        >
          <p class="m-0 text-[0.7rem] tracking-[0.2em] uppercase text-white/80">
            Collection {{ collection.number }}
          </p>
          <h2 class="m-0 font-serif text-3xl font-semibold md:text-4xl">
            {{ collection.title }}
          </h2>
          <p class="m-0 max-w-md text-sm text-white/85">{{ collection.description }}</p>
          <a
            class="mt-1 inline-flex w-fit items-center gap-2 rounded-full bg-brand-charcoal px-5 py-2.5 text-sm font-medium text-brand-white transition hover:bg-black"
            [routerLink]="['/store/products']"
            [queryParams]="{ category: collection.slug }"
          >
            Explore
            <span aria-hidden="true">↗</span>
          </a>
        </div>
      </article>
    }
  </div>
</section>

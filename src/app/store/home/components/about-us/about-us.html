<section class="mx-auto max-w-6xl px-4 py-16">
  <app-home-section-title
    title="About us"
    subtitle="Abo Elenin Glasses — optics with a point of view, since 1990."
  />

  <div class="grid gap-10 md:gap-16">
    @for (story of stories; track story.title; let i = $index) {
      <article
        class="about-story group grid items-center gap-6 overflow-hidden rounded-3xl shadow-md transition duration-500 md:grid-cols-2 md:gap-0"
        [class.bg-brand-white]="!story.imageOnEnd"
        [class.bg-brand-charcoal]="story.imageOnEnd"
      >
        <figure
          class="about-story__frame relative order-1 aspect-4/5 overflow-hidden md:aspect-auto md:min-h-112"
          [class.md:order-2]="story.imageOnEnd"
          [style]="frameStyle(i)"
          (pointermove)="onPointerMove($event, i)"
          (pointerleave)="onPointerLeave()"
        >
          <img
            class="about-story__image"
            [ngSrc]="story.image"
            [alt]="story.imageAlt"
            fill
            sizes="(min-width: 768px) 50vw, 100vw"
          />
        </figure>

        <div
          class="order-2 flex flex-col justify-center px-6 py-6 md:px-12 md:py-16"
          [class.md:order-1]="story.imageOnEnd"
        >
          <p
            class="m-0 text-xs tracking-[0.28em] uppercase"
            [class.text-brand-gray]="!story.imageOnEnd"
            [class.text-white/55]="story.imageOnEnd"
          >
            {{ story.eyebrow }}
          </p>
          <h3
            class="mt-3 text-2xl font-semibold tracking-tight sm:text-3xl"
            [class.text-brand-charcoal]="!story.imageOnEnd"
            [class.text-brand-white]="story.imageOnEnd"
          >
            {{ story.title }}
          </h3>
          <p
            class="mt-4 max-w-md text-sm leading-7 sm:text-base"
            [class.text-brand-gray]="!story.imageOnEnd"
            [class.text-white/70]="story.imageOnEnd"
          >
            {{ story.description }}
          </p>
        </div>
      </article>
    }
  </div>
</section>

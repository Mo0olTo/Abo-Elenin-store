<section class="mx-auto max-w-6xl px-4 py-16">
  <app-home-section-title title="Why us" subtitle="Four reasons people come back for their next pair." />

  <ul class="m-0 grid list-none grid-cols-2 gap-3 p-0 sm:grid-cols-4 sm:gap-4">
    @for (feature of features; track feature.title) {
      <li
        class="flex flex-col items-center gap-3 rounded-2xl border border-black/8 bg-brand-white px-4 py-6 text-center shadow-sm transition duration-300 hover:-translate-y-1 hover:shadow-md"
      >
        <span class="grid size-12 place-items-center rounded-full bg-brand-charcoal text-brand-white">
          @switch (feature.icon) {
            @case ('frames') {
              <svg class="size-6" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="7.5" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6" />
                <circle cx="16.5" cy="12" r="3.2" stroke="currentColor" stroke-width="1.6" />
                <path d="M10.7 12h2.6M4.3 12H3M21 12h-1.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              </svg>
            }
            @case ('price') {
              <svg class="size-6" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M12.8 4.4 19.6 11.2a1.2 1.2 0 0 1 0 1.7l-6.7 6.7a1.2 1.2 0 0 1-1.7 0L4.4 12.8a1.2 1.2 0 0 1-.4-.9V5.6A1.2 1.2 0 0 1 5.2 4.4h6.3c.3 0 .7.1.9.4Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <circle cx="9" cy="9" r="1.1" fill="currentColor" />
              </svg>
            }
            @case ('whatsapp') {
              <svg class="size-6" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M7.4 18.2 5 19.4l1.3-2.3A7.6 7.6 0 1 1 12 19.6a7.5 7.5 0 0 1-3.4-.8Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
                <path
                  d="M9.2 10.6c.2-.5.4-.5.7-.5h.6c.2 0 .4.1.5.4l.4 1c.1.2 0 .4-.1.6l-.4.5c.4.7 1.2 1.5 2 1.9l.5-.4c.2-.2.4-.2.6-.1l1 .4c.3.1.4.3.4.5v.6c0 .3 0 .5-.5.7a4.6 4.6 0 0 1-4.3-.8 7 7 0 0 1-2-2.8c-.2-.5 0-.8.1-1Z"
                  fill="currentColor"
                />
              </svg>
            }
            @case ('delivery') {
              <svg class="size-6" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M3 7.5h10.5v8H3z" stroke="currentColor" stroke-width="1.6" />
                <path d="M13.5 10h4.2L20 13.2v2.3h-6.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                <circle cx="7" cy="17.5" r="1.5" stroke="currentColor" stroke-width="1.6" />
                <circle cx="17" cy="17.5" r="1.5" stroke="currentColor" stroke-width="1.6" />
              </svg>
            }
          }
        </span>

        <h3 class="m-0 text-sm font-semibold text-brand-charcoal sm:text-base">{{ feature.title }}</h3>
      </li>
    }
  </ul>
</section>
